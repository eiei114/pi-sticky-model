name: Auto Release

on:
  workflow_dispatch:
    inputs:
      release_allowed:
        description: Explicitly authorize creating a GitHub release for this version.
        required: true
        type: boolean
        default: false
      package_publish_expected:
        description: Explicitly authorize dispatching the npm publish workflow.
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Create release for new version
    if: github.ref == 'refs/heads/main' && inputs.release_allowed == true && inputs.package_publish_expected == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -1)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag is available; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${PREVIOUS_TAG}:package.json" 2>/dev/null; then
            echo "Previous release package.json is not available; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(git show "${PREVIOUS_TAG}:package.json" | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input).version || ''));")

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version did not change (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump detected: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          gh workflow run publish.yml --ref main -f ref="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
